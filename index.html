<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Otaku Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0a0a0a;--card:#0d0d0d;--a:#ff5c8d;--a2:#ff5c8d;--tx:#F4F7FF;--mu:#8795AD;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;background:none;border:0;font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#000000ee;backdrop-filter:blur(10px);border-bottom:1px solid #1c1c1c}
.logo{display:flex;gap:8px;align-items:center;font-size:26px;font-weight:600;cursor:pointer}.logo b{color:var(--a2)}
.tl{display:flex;gap:4px;margin-left:20px}
.tl button,.btn{padding:9px 16px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;color:var(--mu);transition:.2s}
.tl .on{background:var(--a);color:#fff;}
.btn{border:1px solid #3a3a3a;color:var(--tx)}.btn:hover{border-color:var(--a2)}.btn.p{background:var(--a);border-color:var(--a);}.btn.d{border-color:#a33;color:#f88}
.sr{margin-left:auto;display:flex;align-items:center;width:min(280px,40vw)}.sr input{border-radius:99px}
.av{width:38px;height:38px;border-radius:50%;background:center/cover;border:2px solid var(--a)}
.hb{display:none;font-size:22px}
.side{position:fixed;left:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;width:88px;background:#050505;border-right:1px solid #1c1c1c;z-index:15;display:flex;flex-direction:column;gap:6px;padding:12px 8px;transition:.3s}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px;border-radius:10px;color:var(--mu);font-size:12px}.side button i{font-size:20px;font-style:normal}.side .on{background:var(--a);color:#fff;border:1px solid var(--a)}
main{margin-left:88px;padding:0 0 60px;position:relative;z-index:1}.pg{padding:24px 4%}
.hero{position:relative;min-height:430px;display:flex;align-items:center;padding:30px 5%;background:#000000 right center/cover no-repeat;overflow:hidden}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:1}.hero h1 b{color:var(--a2);font-weight:600}
.hero em{font:italic 500 26px 'Cormorant Garamond',serif;color:#9cc8ff;display:block;margin:10px 0 16px}.hero p{color:#cdd8ee;max-width:380px;margin-bottom:22px;line-height:1.5}
.hero .bs{display:flex;gap:12px;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:1.3fr 1.5fr 1.1fr;gap:14px;padding:16px 4% 0}
.panel{background:#0a0a0acc;border:1px solid #262626;border-radius:14px;padding:14px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sh h2{font-size:24px;font-weight:600}.sh button{color:var(--a2);font-size:13px}
section{margin-bottom:26px}.pg section,main>section{padding:0}.wide{padding:20px 4% 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth}.row .card{flex:0 0 155px}
.card{position:relative;background:var(--card);border:1px solid #262626;border-radius:12px;overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{border-color:var(--a2);transform:translateY(-4px);}
.th{aspect-ratio:2/3;background:linear-gradient(160deg,#1a1a1a,#050505) center/cover;display:grid;place-items:center;position:relative}.th .bf{position:static;width:40px;animation:none;opacity:.6}
.th.w{aspect-ratio:16/9;border-radius:10px}
.ci{padding:8px 10px;display:grid;gap:2px}.ci b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci span{color:var(--mu);font-size:12px}
.hrt{position:absolute;top:6px;right:8px;font-size:20px;color:var(--a2);text-shadow:0 0 6px #000}
.pb{height:4px;background:#222222;border-radius:4px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--a2)}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid #262626;border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}.li .th{width:120px;flex:none}.li div{min-width:0;flex:1}.li span{color:var(--mu);font-size:12px}
.mu{color:var(--mu)}
.empty{text-align:center;padding:36px 16px;border:1px dashed #262626;border-radius:16px;display:grid;gap:8px;justify-items:center;background:#0a0a0a99}.empty img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--a);}.empty p{color:var(--mu);max-width:380px}.empty h3{font-size:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 14px;border-radius:99px;border:1px solid #262626;color:var(--mu)}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
input,select,textarea{background:var(--card);border:1px solid #262626;color:var(--tx);padding:10px 12px;border-radius:8px;width:100%;font:inherit}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:60;padding:16px}.box{background:var(--bg2);border:1px solid #333333;border-radius:16px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px;}
.err{color:#ff8a8a}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111111;border:1px solid var(--a2);padding:10px 18px;border-radius:99px;z-index:90}
.dt{display:grid;grid-template-columns:280px 1fr;gap:28px;position:relative}.dt .th{border-radius:14px;border:1px solid var(--a);}.dt h1{font-size:44px}.dt .bs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.body{position:fixed;right:0;bottom:0;height:70vh;opacity:.13;pointer-events:none;z-index:0}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #262626}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff3;margin-right:8px}.sw.on{border-color:#fff}
.pl{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}.pl video,.pl iframe{flex:1;min-height:0;width:100%;border:0;background:#000}
.pt2{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#050505}.pt2 b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:#050505}.ctl input[type=range]{width:auto;padding:0;flex:1;min-width:120px}.ctl .v{flex:none;width:90px;min-width:0}.ctl select{width:auto}
.pvmsg{flex:1;display:grid;place-items:center;text-align:center;padding:20px;color:#ffb0b0}
.pt{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1.5px 1.5px at 20% 30%,var(--a),#0000),radial-gradient(1.5px 1.5px at 70% 60%,#fff8,#0000),radial-gradient(2px 2px at 40% 80%,var(--a),#0000);background-size:300px 300px;animation:dr 30s linear infinite}
@keyframes dr{to{background-position:0 -300px}}
.bf{position:absolute;width:56px;fill:var(--a);filter:drop-shadow(0 0 8px var(--a));opacity:.85;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(24px,-34px) rotate(12deg) scaleX(.8)}}
.noanim *{animation:none!important;transition:none!important}
@media(max-width:900px){.tl{display:none}.hb{display:block}.side{transform:translateX(-100%)}.side.open{transform:none}main{margin-left:0}.panels{grid-template-columns:1fr}.dt{grid-template-columns:1fr}.dt .th{max-width:240px}.hero{background-position:70% center}.sr{width:40vw}.logo span{display:none}}
html,body{overflow-x:hidden;max-width:100%}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
input,select,textarea{font-size:16px}
.btn,.chip,.tl button{min-height:44px}.side button{min-height:56px}.side{overflow-y:auto}.hrt{padding:6px 8px;min-width:40px;min-height:40px}.ctl button{min-width:44px;min-height:44px;font-size:20px}
.pl{height:100vh;height:100dvh}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000000 28%,#0000 70%)}
.scrim{position:fixed;inset:0;background:#0009;z-index:14}.body{max-width:60vw}
@media(max-width:900px){.side{height:calc(100dvh - 64px);bottom:auto}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.row .card{flex-basis:130px}.hero{min-height:380px;padding:24px 5%}.hero::before{background:linear-gradient(180deg,#000000aa,#000000ee)}.hero em{font-size:22px}.li .th{width:90px}.dt h1{font-size:32px}.body{height:40vh}.pg{padding:18px 4%}.sh h2{font-size:22px!important}.logo{font-size:22px}.sr{width:34vw}}
@media(max-height:500px) and (orientation:landscape){.pt2,.ctl{padding:4px 10px}.hero{min-height:300px}}
h1,h2,h3,.logo{font-family:'Noto Serif JP','Cormorant Garamond',Georgia,serif}
.pt{display:none}
.logo{font-size:20px;letter-spacing:.14em;font-weight:900}.logo span{display:inline!important}
.hero{background:#000;min-height:0;padding:56px 5% 36px}.hero::before{display:none}
.hero h1{font-size:clamp(64px,13vw,170px);line-height:1.12;font-weight:900;color:#fff}
.hero .ln{width:90px;height:4px;background:var(--a);margin:26px 0 16px}
.hero .en{letter-spacing:.4em;font-weight:600;font-size:15px}
.hero p{color:var(--a);margin:10px 0 24px;max-width:none}
.tl .on,.btn.p,.chip.on{color:#000;font-weight:600}
.sh small{font:400 14px Inter,sans-serif;color:var(--mu);margin-left:8px}
@media(max-width:600px){.logo{font-size:15px}}

let toast=()=>{};
const uid=()=>Math.random().toString(36).slice(2,9);
const ft=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const gid=u=>{const m=/drive\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/));return m?m[1]:null};
const CATS=['Anime','Movie','Series','Video','Other'];
const NAV=[['home','Home','⌂'],['library','Library','▶'],['playlists','Playlists','☰'],['history','History','↺'],['prefs','Settings','⚙']];
function useLS(k,d){const[v,s]=useState(()=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}});
useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Browser storage is full or blocked, so changes may not persist.')}},[v]);return[v,s]}
const Bf=({s})=>h`<svg className="bf" style=${s} viewBox="0 0 40 40"><path d="M20 20C14 4 2 6 4 18c1 8 10 8 16 2zM20 20c6-16 18-14 16-2-1 8-10 8-16 2zM20 20c-6 2-12 8-8 16 4 2 8-8 8-16zM20 20c6 2 12 8 8 16-4 2-8-8-8-16z"/></svg>`;
const Th=({v,w})=>h`<div className=${'th'+(w?' w':'')} style=${v.thumb?{backgroundImage:`url("${v.thumb}")`}:null}>${!v.thumb&&h`<${Bf}/>`}</div>`;
const Empty=({t,s,b})=>h`<div className="empty"><img src=${FACE} alt=""/><h3>${t}</h3><p>${s}</p>${b}</div>`;
const Sec=({t,ic,act,children})=>h`<section><div className="sh"><h2>${ic} ${t}</h2>${act}</div>${children}</section>`;
const Card=({v,c})=>h`<div className="card" onClick=${()=>c.go('video-'+v.id)}><${Th} v=${v}/><div className="ci"><b>${v.title}</b><span>${v.cat}${v.dur?' · '+v.dur:''}</span></div><button className="hrt" onClick=${e=>{e.stopPropagation();c.tf(v.id)}}>${c.fav.includes(v.id)?'♥':'♡'}</button></div>`;
const AddBtn=({c})=>!c.ed?null:h`<button className="btn p" onClick=${()=>c.openForm(null)}>+ Add Video</button>`;

function Home(c){const{vids,his,fav,pls,go,play}=c;const row=useRef();
const cont=Object.entries(his).map(([id,e])=>({v:vids.find(x=>x.id===id),e})).filter(x=>x.v&&x.e.p>5&&(!x.e.d||x.e.p<x.e.d-10)).sort((a,b)=>b.e.t-a.e.t).slice(0,2);
const sc=v=>(his[v.id]?.n||0)+(fav.includes(v.id)?1:0);
const trend=vids.filter(v=>sc(v)>0).sort((a,b)=>sc(b)-sc(a)).slice(0,4);
const rec=[...vids].sort((a,b)=>b.added-a.added).slice(0,12);
const va=(p)=>h`<button onClick=${()=>go(p)}>View All →</button>`;
return h`<div>
<div className="hero"><div><h1>オタク<br/>アーカイブ</h1><div className="ln"></div><div className="en">OTAKU ARCHIVE</div><p>A place where, something is alive</p><div className="bs"><button className="btn p" onClick=${()=>go('library')}>▶ Explore Library</button><button className="btn" onClick=${()=>go('playlists')}>☆ My Playlists</button></div></div></div>
<div className="panels">
<div className="panel"><${Sec} t="Continue Watching" ic="▶" act=${va('history')}>${cont.length?cont.map(({v,e})=>h`<div key=${v.id} style=${{marginBottom:10}}><${Th} v=${v} w=${1}/><b style=${{display:'block',marginTop:6}}>${v.title}</b><div className="pb"><i style=${{width:(e.d?e.p/e.d*100:0)+'%'}}></i></div><div className="mu" style=${{margin:'6px 0'}}>${ft(e.d-e.p)} left</div><button className="btn p" onClick=${()=>play(v.id)}>Resume</button></div>`):h`<p className="mu">Nothing in progress yet. Start a video and it will appear here.</p>`}<//></div>
<div className="panel"><${Sec} t="Trending Now" ic="🔥" act=${va('library')}>${trend.length?h`<div className="row">${trend.map(v=>h`<${Card} key=${v.id} v=${v} c=${c}/>`)}</div>`:h`<p className="mu">Watch or favourite videos and your most loved ones trend here.</p>`}<//></div>

function useShared(){

off.push(d.collection('videos').onSnapshot(s=>setRv(s.docs.map(x=>x.data())),()=>{}));off.push(d.collection('playlists').onSnapshot(s=>setRp(s.docs.map(x=>x.data())),()=>{}));setMode('shared')}catch(e){}})();return()=>{dead=true;off.forEach(f=>f&&f())}},[]);
