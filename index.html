<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Otaku Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030610;--bg2:#080E1C;--card:#0C1629;--a:#087BFF;--a2:#00B7FF;--tx:#F4F7FF;--mu:#8795AD;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;background:none;border:0;font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#030610ee;backdrop-filter:blur(10px);border-bottom:1px solid #0e2a55}
.logo{display:flex;gap:8px;align-items:center;font-size:26px;font-weight:600;cursor:pointer}.logo b{color:var(--a2)}
.tl{display:flex;gap:4px;margin-left:20px}
.tl button,.btn{padding:9px 16px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;color:var(--mu);transition:.2s}
.tl .on{background:var(--a);color:#fff;box-shadow:0 0 18px #087bff88}
.btn{border:1px solid #2a4a85;color:var(--tx)}.btn:hover{border-color:var(--a2)}.btn.p{background:var(--a);border-color:var(--a);box-shadow:0 0 20px #087bff66}.btn.d{border-color:#a33;color:#f88}
.sr{margin-left:auto;display:flex;align-items:center;width:min(280px,40vw)}.sr input{border-radius:99px}
.av{width:38px;height:38px;border-radius:50%;background:center/cover;border:2px solid var(--a)}
.hb{display:none;font-size:22px}
.side{position:fixed;left:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;width:88px;background:#050b1a;border-right:1px solid #0e2a55;z-index:15;display:flex;flex-direction:column;gap:6px;padding:12px 8px;transition:.3s}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px;border-radius:10px;color:var(--mu);font-size:12px}.side button i{font-size:20px;font-style:normal}.side .on{background:#087bff33;color:#fff;border:1px solid var(--a)}
main{margin-left:88px;padding:0 0 60px;position:relative;z-index:1}.pg{padding:24px 4%}
.hero{position:relative;min-height:430px;display:flex;align-items:center;padding:30px 5%;background:#030610 right center/cover no-repeat;overflow:hidden}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:1}.hero h1 b{color:var(--a2);font-weight:600}
.hero em{font:italic 500 26px 'Cormorant Garamond',serif;color:#9cc8ff;display:block;margin:10px 0 16px}.hero p{color:#cdd8ee;max-width:380px;margin-bottom:22px;line-height:1.5}
.hero .bs{display:flex;gap:12px;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:1.3fr 1.5fr 1.1fr;gap:14px;padding:16px 4% 0}
.panel{background:#060d1fcc;border:1px solid #12306a;border-radius:14px;padding:14px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sh h2{font-size:24px;font-weight:600}.sh button{color:var(--a2);font-size:13px}
section{margin-bottom:26px}.pg section,main>section{padding:0}.wide{padding:20px 4% 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth}.row .card{flex:0 0 155px}
.card{position:relative;background:var(--card);border:1px solid #12306a;border-radius:12px;overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{border-color:var(--a2);transform:translateY(-4px);box-shadow:0 0 18px #00b7ff40}
.th{aspect-ratio:2/3;background:linear-gradient(160deg,#0a1f4a,#050a18) center/cover;display:grid;place-items:center;position:relative}.th .bf{position:static;width:40px;animation:none;opacity:.6}
.th.w{aspect-ratio:16/9;border-radius:10px}
.ci{padding:8px 10px;display:grid;gap:2px}.ci b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci span{color:var(--mu);font-size:12px}
.hrt{position:absolute;top:6px;right:8px;font-size:20px;color:var(--a2);text-shadow:0 0 6px #000}
.pb{height:4px;background:#1a2a50;border-radius:4px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--a2)}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid #12306a;border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}.li .th{width:120px;flex:none}.li div{min-width:0;flex:1}.li span{color:var(--mu);font-size:12px}
.mu{color:var(--mu)}
.empty{text-align:center;padding:36px 16px;border:1px dashed #1d3a70;border-radius:16px;display:grid;gap:8px;justify-items:center;background:#060d1f99}.empty img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--a);box-shadow:0 0 24px #087bff66}.empty p{color:var(--mu);max-width:380px}.empty h3{font-size:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 14px;border-radius:99px;border:1px solid #1d3a70;color:var(--mu)}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
input,select,textarea{background:var(--card);border:1px solid #1d3a70;color:var(--tx);padding:10px 12px;border-radius:8px;width:100%;font:inherit}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:60;padding:16px}.box{background:var(--bg2);border:1px solid #1d4a9a;border-radius:16px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px;box-shadow:0 0 40px #087bff44}
.err{color:#ff8a8a}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0c1f44;border:1px solid var(--a2);padding:10px 18px;border-radius:99px;z-index:90}
.dt{display:grid;grid-template-columns:280px 1fr;gap:28px;position:relative}.dt .th{border-radius:14px;border:1px solid var(--a);box-shadow:0 0 30px #087bff55}.dt h1{font-size:44px}.dt .bs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.body{position:fixed;right:0;bottom:0;height:70vh;opacity:.13;pointer-events:none;z-index:0}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #12306a}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff3;margin-right:8px}.sw.on{border-color:#fff}
.pl{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}.pl video,.pl iframe{flex:1;min-height:0;width:100%;border:0;background:#000}
.pt2{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#050a18}.pt2 b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:#050a18}.ctl input[type=range]{width:auto;padding:0;flex:1;min-width:120px}.ctl .v{flex:none;width:90px;min-width:0}.ctl select{width:auto}
.pvmsg{flex:1;display:grid;place-items:center;text-align:center;padding:20px;color:#ffb0b0}
.pt{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1.5px 1.5px at 20% 30%,#00b7ffaa,#0000),radial-gradient(1.5px 1.5px at 70% 60%,#fff8,#0000),radial-gradient(2px 2px at 40% 80%,#00b7ff88,#0000);background-size:300px 300px;animation:dr 30s linear infinite}
@keyframes dr{to{background-position:0 -300px}}
.bf{position:absolute;width:56px;fill:#00b7ff;filter:drop-shadow(0 0 8px #00b7ff);opacity:.85;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(24px,-34px) rotate(12deg) scaleX(.8)}}
.noanim *{animation:none!important;transition:none!important}
@media(max-width:900px){.tl{display:none}.hb{display:block}.side{transform:translateX(-100%)}.side.open{transform:none}main{margin-left:0}.panels{grid-template-columns:1fr}.dt{grid-template-columns:1fr}.dt .th{max-width:240px}.hero{background-position:70% center}.sr{width:40vw}.logo span{display:none}}
html,body{overflow-x:hidden;max-width:100%}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
input,select,textarea{font-size:16px}
.btn,.chip,.tl button{min-height:44px}.side button{min-height:56px}.side{overflow-y:auto}.hrt{padding:6px 8px;min-width:40px;min-height:40px}.ctl button{min-width:44px;min-height:44px;font-size:20px}
.pl{height:100vh;height:100dvh}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030610 28%,#0000 70%)}
.scrim{position:fixed;inset:0;background:#0009;z-index:14}.body{max-width:60vw}
@media(max-width:900px){.side{height:calc(100dvh - 64px);bottom:auto}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.row .card{flex-basis:130px}.hero{min-height:380px;padding:24px 5%}.hero::before{background:linear-gradient(180deg,#030610aa,#030610ee)}.hero em{font-size:22px}.li .th{width:90px}.dt h1{font-size:32px}.body{height:40vh}.pg{padding:18px 4%}.sh h2{font-size:22px!important}.logo{font-size:22px}.sr{width:34vw}}
@media(max-height:500px) and (orientation:landscape){.pt2,.ctl{padding:4px 10px}.hero{min-height:300px}}
</style></head><body><div id="r"></div>

let toast=()=>{};
const uid=()=>Math.random().toString(36).slice(2,9);
const ft=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const gid=u=>{const m=/drive\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/));return m?m[1]:null};
const CATS=['Anime','Movie','Series','Video','Other'];
const NAV=[['home','Home','⌂'],['library','Library','▶'],['playlists','Playlists','☰'],['history','History','↺'],['prefs','Settings','⚙']];
function useLS(k,d){const[v,s]=useState(()=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}});
useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Browser storage is full or blocked, so changes may not persist.')}},[v]);return[v,s]}
const Bf=({s})=>h`<svg className="bf" style=${s} viewBox="0 0 40 40"><path d="M20 20C14 4 2 6 4 18c1 8 10 8 16 2zM20 20c6-16 18-14 16-2-1 8-10 8-16 2zM20 20c-6 2-12 8-8 16 4 2 8-8 8-16zM20 20c6 2 12 8 8 16-4 2-8-8-8-16z"/></svg>`;
const Th=({v,w})=>h`<div className=${'th'+(w?' w':'')} style=${v.thumb?{backgroundImage:`url("${v.thumb}")`}:null}>${!v.thumb&&h`<${Bf}/>`}</div>`;
const Empty=({t,s,b})=>h`<div className="empty"><img src=${FACE} alt=""/><h3>${t}</h3><p>${s}</p>${b}</div>`;
const Sec=({t,ic,act,children})=>h`<section><div className="sh"><h2>${ic} ${t}</h2>${act}</div>${children}</section>`;
const Card=({v,c})=>h`<div className="card" onClick=${()=>c.go('video-'+v.id)}><${Th} v=${v}/><div className="ci"><b>${v.title}</b><span>${v.cat}${v.dur?' · '+v.dur:''}</span></div><button className="hrt" onClick=${e=>{e.stopPropagation();c.tf(v.id)}}>${c.fav.includes(v.id)?'♥':'♡'}</button></div>`;
const AddBtn=({c})=>!c.ed?null:h`<button className="btn p" onClick=${()=>c.openForm(null)}>+ Add Video</button>`;

function Home(c){const{vids,his,fav,pls,go,play}=c;const row=useRef();
const cont=Object.entries(his).map(([id,e])=>({v:vids.find(x=>x.id===id),e})).filter(x=>x.v&&x.e.p>5&&(!x.e.d||x.e.p<x.e.d-10)).sort((a,b)=>b.e.t-a.e.t).slice(0,2);
const sc=v=>(his[v.id]?.n||0)+(fav.includes(v.id)?1:0);
const trend=vids.filter(v=>sc(v)>0).sort((a,b)=>sc(b)-sc(a)).slice(0,4);
const rec=[...vids].sort((a,b)=>b.added-a.added).slice(0,12);
const va=(p)=>h`<button onClick=${()=>go(p)}>View All →</button>`;
return h`<div>
<div className="hero" style=${{backgroundImage:`url(${HERO})`}}>
<${Bf} s=${{left:'4%',top:'12%',width:90}}/><${Bf} s=${{left:'52%',top:'62%',animationDelay:'-3s'}}/><${Bf} s=${{right:'6%',top:'8%',animationDelay:'-6s'}}/>
<div style=${{position:'relative'}}><h1>Otaku <b>Archive</b></h1><em>A place where, something is alive</em><p>Dive into a world of anime, movies and more. Your personal archive, just a click away.</p>
<div className="bs"><button className="btn p" onClick=${()=>go('library')}>▶ Explore Library</button><button className="btn" onClick=${()=>go('playlists')}>☆ My Playlists</button></div></div></div>
<div className="panels">
<div className="panel"><${Sec} t="Continue Watching" ic="▶" act=${va('history')}>${cont.length?cont.map(({v,e})=>h`<div key=${v.id} style=${{marginBottom:10}}><${Th} v=${v} w=${1}/><b style=${{display:'block',marginTop:6}}>${v.title}</b><div className="pb"><i style=${{width:(e.d?e.p/e.d*100:0)+'%'}}></i></div><div className="mu" style=${{margin:'6px 0'}}>${ft(e.d-e.p)} left</div><button className="btn p" onClick=${()=>play(v.id)}>Resume</button></div>`):h`<p className="mu">Nothing in progress yet. Start a video and it will appear here.</p>`}<//></div>
<div className="panel"><${Sec} t="Trending Now" ic="🔥" act=${va('library')}>${trend.length?h`<div className="row">${trend.map(v=>h`<${Card} key=${v.id} v=${v} c=${c}/>`)}</div>`:h`<p className="mu">Watch or favourite videos and your most loved ones trend here.</p>`}<//></div>
<div className="panel"><${Sec} t="My Playlists" ic="★" act=${va('playlists')}>${pls.length?pls.slice(0,3).map(p=>{const f=vids.find(v=>v.id===p.ids[0]);return h`<div key=${p.id} className="li" onClick=${()=>go('playlist-'+p.id)}><${Th} v=${f||{}}/><div><b>${p.name}</b><br/><span>${p.ids.length} videos</span></div></div>`}):h`<p className="mu">Create a playlist to organise your archive.</p>`}<//></div>
</div>
<div className="wide"><${Sec} t="Recently Added" ic="✦" act=${h`<span><button onClick=${()=>row.current.scrollBy(-400,0)}>‹</button> <button onClick=${()=>row.current.scrollBy(400,0)}>›</button></span>`}>${rec.length?h`<div className="row" ref=${row}>${rec.map(v=>h`<${Card} key=${v.id} v=${v} c=${c}/>`)}</div>`:h`<${Empty} t="Your archive is empty" s="Add your first video from Google Drive or a direct MP4 link to begin." b=${h`<${AddBtn} c=${c}/>`}/>`}<//>
${vids.length>0&&h`<${Sec} t="All Videos" ic="▦"><div className="grid">${vids.map(v=>h`<${Card} key=${v.id} v=${v} c=${c}/>`)}</div><//>`}</div></div>`}

function Lib(c){const{vids,fav,q}=c;const[cat,setCat]=useState('All'),[so,setSo]=useState('new'),[fo,setFo]=useState(false);
const l=vids.filter(v=>(cat==='All'||v.cat===cat)&&(!fo||fav.includes(v.id))&&(v.title+' '+v.desc).toLowerCase().includes(q.toLowerCase()));
l.sort(so==='az'?(a,b)=>a.title.localeCompare(b.title):so==='old'?(a,b)=>a.added-b.added:(a,b)=>b.added-a.added);
return h`<div className="pg"><div className="sh"><h2 style=${{fontSize:38}}>Library</h2><${AddBtn} c=${c}/></div>
<div className="chips">${['All',...CATS].map(x=>h`<button key=${x} className=${'chip'+(cat===x?' on':'')} onClick=${()=>setCat(x)}>${x}</button>`)}<button className=${'chip'+(fo?' on':'')} onClick=${()=>setFo(!fo)}>♥ Favourites</button><select style=${{width:'auto'}} value=${so} onChange=${e=>setSo(e.target.value)}><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option></select></div>
${l.length?h`<div className="grid">${l.map(v=>h`<${Card} key=${v.id} v=${v} c=${c}/>`)}</div>`:h`<${Empty} t=${vids.length?'No matches':'No videos yet'} s=${vids.length?'Try another search or filter.':'Add a video with a Google Drive sharing link or a direct MP4 URL.'} b=${!vids.length&&h`<${AddBtn} c=${c}/>`}/>`}</div>`}

function Detail(c){const{vids,fav,pls,setP,go,play,tf,openForm,ask,delV,id}=c;const v=vids.find(x=>x.id===id);
if(!v)return h`<div className="pg"><${Empty} t="Video not found" s="It may have been deleted." b=${h`<button className="btn" onClick=${()=>go('library')}>Back to Library</button>`}/></div>`;
const inP=pls.filter(p=>p.ids.includes(id)),rel=vids.filter(x=>x.id!==id&&x.cat===v.cat).slice(0,8);
return h`<div className="pg"><img className="body" src=${BODY} alt=""/><div className="dt"><${Th} v=${v}/><div style=${{position:'relative'}}><h1>${v.title}</h1>
<p className="mu">${v.cat}${v.dur?' · '+v.dur:''}${inP.length?' · In: '+inP.map(p=>p.name).join(', '):''}</p><p style=${{margin:'14px 0',lineHeight:1.6,maxWidth:560}}>${v.desc||'No description.'}</p>
<div className="bs"><button className="btn p" onClick=${()=>play(v.id)}>▶ Play Now</button><button className="btn" onClick=${()=>tf(v.id)}>${fav.includes(id)?'♥ Favourited':'♡ Add to Favourites'}</button>${c.ed&&h`<button className="btn" onClick=${()=>openForm(v)}>Edit</button><button className="btn d" onClick=${()=>ask('Delete "'+v.title+'" from your library?',()=>{delV(id);go('library')})}>Delete</button>`}</div>
${c.ed&&pls.length>0&&h`<select style=${{maxWidth:260}} value="" onChange=${e=>{const pid=e.target.value;if(pid)setP(ps=>ps.map(p=>p.id===pid?{...p,ids:[...new Set([...p.ids,id])]}:p))}}><option value="">+ Add to playlist…</option>${pls.filter(p=>!p.ids.includes(id)).map(p=>h`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select>`}</div></div>
${rel.length>0&&h`<div style=${{marginTop:30,position:'relative'}}><${Sec} t="Related Videos"><div className="row">${rel.map(x=>h`<${Card} key=${x.id} v=${x} c=${c}/>`)}</div><//></div>`}</div>`}

function Pls(c){const{pls,setP,vids,go}=c;const[n,setN]=useState('');
const add=()=>{if(!n.trim())return;setP([...pls,{id:uid(),name:n.trim(),ids:[]}]);setN('')};
return h`<div className="pg"><h2 style=${{fontSize:38,marginBottom:14}}>Playlists</h2>${c.ed&&h`<div style=${{display:'flex',gap:10,maxWidth:460,marginBottom:20}}><input placeholder="New playlist name" value=${n} onChange=${e=>setN(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&add()}/><button className="btn p" onClick=${add}>Create</button></div>`}
${pls.length?h`<div className="grid">${pls.map(p=>{const f=vids.find(v=>v.id===p.ids[0]);return h`<div key=${p.id} className="card" onClick=${()=>go('playlist-'+p.id)}><${Th} v=${f||{}}/><div className="ci"><b>${p.name}</b><span>${p.ids.length} videos</span></div></div>`})}</div>`:h`<${Empty} t="No playlists yet" s="Create one above, then add videos from any video page."/>`}</div>`}

function PlD(c){const{pls,setP,vids,go,play,ask,id}=c;const p=pls.find(x=>x.id===id);const[nm,setNm]=useState(p?p.name:'');useEffect(()=>{p&&setNm(p.name)},[p&&p.name]);
if(!p)return h`<div className="pg"><${Empty} t="Playlist not found" s="" b=${h`<button className="btn" onClick=${()=>go('playlists')}>Back</button>`}/></div>`;
const vs=p.ids.map(i=>vids.find(v=>v.id===i)).filter(Boolean),up=f=>setP(ps=>ps.map(x=>x.id===id?f(x):x));
return h`<div className="pg"><div style=${{display:'flex',gap:10,flexWrap:'wrap',marginBottom:16}}>${c.ed?h`<input style=${{maxWidth:280}} value=${nm} onChange=${e=>setNm(e.target.value)}/><button className="btn" onClick=${()=>nm.trim()&&up(x=>({...x,name:nm.trim()}))}>Rename</button>`:h`<h2>${p.name}</h2>`}<button className="btn p" disabled=${!vs.length} onClick=${()=>play(vs[0].id)}>▶ Play All</button>${c.ed&&h`<button className="btn d" onClick=${()=>ask('Delete playlist "'+p.name+'"? Videos stay in your library.',()=>{setP(ps=>ps.filter(x=>x.id!==id));go('playlists')})}>Delete</button>`}</div>
${vs.length?vs.map(v=>h`<div key=${v.id} className="li"><div style=${{display:'flex',gap:12,alignItems:'center'}} onClick=${()=>play(v.id)}><${Th} v=${v}/><div><b>${v.title}</b><br/><span>${v.cat}</span></div></div>${c.ed&&h`<button className="btn" onClick=${()=>up(x=>({...x,ids:x.ids.filter(i=>i!==v.id)}))}>Remove</button>`}</div>`):h`<${Empty} t="This playlist is empty" s="Add videos below."/>`}
${c.ed&&h`<select style=${{maxWidth:300,marginTop:12}} value="" onChange=${e=>e.target.value&&up(x=>({...x,ids:[...x.ids,e.target.value]}))}><option value="">+ Add a video…</option>${vids.filter(v=>!p.ids.includes(v.id)).map(v=>h`<option key=${v.id} value=${v.id}>${v.title}</option>`)}</select>`}</div>`}

function Hist(c){const{vids,his,setH,play,ask}=c;
const l=Object.entries(his).map(([id,e])=>({v:vids.find(x=>x.id===id),e})).filter(x=>x.v).sort((a,b)=>b.e.t-a.e.t);
return h`<div className="pg"><div className="sh"><h2 style=${{fontSize:38}}>History</h2>${l.length>0&&h`<button className="btn d" onClick=${()=>ask('Clear all watch history?',()=>setH({}))}>Clear History</button>`}</div>
${l.length?l.map(({v,e})=>h`<div key=${v.id} className="li" onClick=${()=>play(v.id)}><${Th} v=${v}/><div><b>${v.title}</b><br/><span>${new Date(e.t).toLocaleString()}${e.d?' · '+ft(e.p)+' / '+ft(e.d):''}</span>${e.d>0&&h`<div className="pb"><i style=${{width:Math.min(100,e.p/e.d*100)+'%'}}></i></div>`}</div><span className="btn p">${e.p>5?'Resume':'Play'}</span></div>`):h`<${Empty} t="Nothing watched yet" s="Videos you play will be listed here with resume points."/>`}</div>`}

function Prefs(c){const{set,setS,setH,setV,setP,setF,ask,ed,mode}=c;const T=(k,l)=>h`<div className="tg"><span>${l}</span><button className=${'chip'+(set[k]?' on':'')} onClick=${()=>setS({...set,[k]:!set[k]})}>${set[k]?'On':'Off'}</button></div>`;
return h`<div className="pg" style=${{maxWidth:640}}><h2 style=${{fontSize:38,marginBottom:10}}>Settings</h2>
<div className="tg"><span>Accent theme</span><span>${['#087BFF','#00B7FF','#8a5cff','#ff4d8d'].map(x=>h`<button key=${x} className=${'sw'+(set.ac===x?' on':'')} style=${{background:x}} onClick=${()=>setS({...set,ac:x})}></button>`)}</span></div>
${T('anim','Animations (butterflies, particles, transitions)')}${T('sfx','Sound effects')}
<div className="tg"><span>Clear watch history</span><button className="btn d" onClick=${()=>ask('Clear all watch history?',()=>{setH({});toast('History cleared')})}>Clear</button></div>
<div className="tg"><span>Library sync</span><span className="mu">${mode==='shared'?(ed?'Shared · you can edit':'Shared · view only'):'This device only'}</span></div>
${ed&&h`<div className="tg"><span>${mode==='shared'?'Clear shared library (affects everyone)':'Clear local library'}</span><button className="btn d" onClick=${()=>ask('Delete ALL videos, playlists and favourites from this browser?',()=>{setV([]);setP([]);setF([]);setH({});toast('Library cleared')})}>Clear</button></div>`}
<h2 style=${{margin:'26px 0 8px'}}>About</h2><p className="mu" style=${{lineHeight:1.6}}>Otaku Archive — “A place where, something is alive.” Videos and playlists are links and metadata only (no video files). When the page can reach the shared database they sync for everyone with access, and only the owner and editors can change them; otherwise they stay in this browser. Favourites, history and settings stay on each device. Direct MP4/WebM links use the built-in player. Google Drive links use Drive's embedded player, which depends on the file's sharing permissions (“Anyone with the link”) and may not work for every file. Clearing browser data erases your library.</p></div>`}

function Form({v,pls,onSave,onClose}){const[f,sf]=useState(v||{title:'',url:'',thumb:'',desc:'',cat:'Anime',dur:'',sub:''});const[pl,spl]=useState('');const[e,se]=useState('');
const s=k=>ev=>sf({...f,[k]:ev.target.value});
const sub=()=>{const u=f.url.trim();if(!f.title.trim())return se('Title is required.');if(!/^https?:\/\//i.test(u))return se('Enter a valid http(s) video or Google Drive link.');if(/drive\.google/.test(u)&&!gid(u))return se('Could not find a file ID in that Drive link. Use the “Share” link of a single file.');onSave({...f,title:f.title.trim(),url:u},pl)};
return h`<div className="modal" onClick=${onClose}><div className="box" onClick=${x=>x.stopPropagation()}><h2>${v?'Edit Video':'Add Video'}</h2>
<input placeholder="Title *" value=${f.title} onChange=${s('title')}/><input placeholder="Google Drive sharing link or direct MP4 URL *" value=${f.url} onChange=${s('url')}/><input placeholder="Thumbnail URL" value=${f.thumb} onChange=${s('thumb')}/>
<textarea rows="3" placeholder="Description" value=${f.desc} onChange=${s('desc')}></textarea>
<select value=${f.cat} onChange=${s('cat')}>${CATS.map(x=>h`<option key=${x}>${x}</option>`)}</select>
${!v&&h`<select value=${pl} onChange=${x=>spl(x.target.value)}><option value="">No playlist</option>${pls.map(p=>h`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select>`}
<input placeholder="Duration (optional, e.g. 24 min)" value=${f.dur} onChange=${s('dur')}/><input placeholder="Subtitle URL (.vtt, optional, direct videos only)" value=${f.sub||''} onChange=${s('sub')}/>
${e&&h`<div className="err">${e}</div>`}<div style=${{display:'flex',gap:10,justifyContent:'flex-end'}}><button className="btn" onClick=${onClose}>Cancel</button><button className="btn p" onClick=${sub}>Save</button></div></div></div>`}

function Player({v,q,go,save,start,exit}){const g=gid(v.url),r=useRef(),last=useRef(0);const[s,S]=useState({p:false,t:0,d:0,vol:1,rate:1,err:''});
useEffect(()=>{save(v.id,start,0,true)},[]);
const i=q.findIndex(x=>x.id===v.id),mv=d=>q[i+d]&&go('watch-'+q[i+d].id),tg=()=>{const e=r.current;e.paused?e.play():e.pause()};
const fs=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else r.current&&r.current.webkitEnterFullscreen&&r.current.webkitEnterFullscreen()}catch(e){}};
const top=h`<div className="pt2"><button className="btn" onClick=${exit}>← Exit</button><b>${v.title}</b><button className="btn" disabled=${i<1} onClick=${()=>mv(-1)}>⏮ Prev</button><button className="btn" disabled=${i<0||i>=q.length-1} onClick=${()=>mv(1)}>Next ⏭</button></div>`;
if(g)return h`<div className="pl">${top}<iframe src=${'https://drive.google.com/file/d/'+g+'/preview'} allow="autoplay; fullscreen" allowFullScreen title=${v.title}></iframe><div className="pt2"><span className="mu">Embedded Google Drive player. Progress cannot be tracked here. If it shows a permission error, set the file to “Anyone with the link can view”.</span></div></div>`;
return h`<div className="pl">${top}${s.err?h`<div className="pvmsg"><div><h2>Cannot play this video</h2><p style=${{margin:'10px 0'}}>${s.err}</p><button className="btn" onClick=${exit}>Back to details</button></div></div>`:h`<video ref=${r} src=${v.url} autoPlay playsInline onClick=${tg}
onLoadedMetadata=${e=>{const d=e.currentTarget.duration;S(x=>({...x,d}));if(start>5&&start<d-10)e.currentTarget.currentTime=start;e.currentTarget.play().catch(()=>{})}}
onTimeUpdate=${e=>{const t=e.currentTarget.currentTime;S(x=>({...x,t}));if(Date.now()-last.current>3000){last.current=Date.now();save(v.id,t,e.currentTarget.duration)}}}
onPlay=${()=>S(x=>({...x,p:true}))} onPause=${e=>{S(x=>({...x,p:false}));save(v.id,e.currentTarget.currentTime,e.currentTarget.duration)}}
onEnded=${e=>{save(v.id,0,e.currentTarget.duration);mv(1)}}
onError=${()=>S(x=>({...x,err:"The link may be private, expired, not a direct video file, or in a format your browser can't play (MP4/H.264 is safest)."}))}>${v.sub&&h`<track kind="subtitles" src=${v.sub} srcLang="en" label="Subtitles"/>`}</video>`}
${!s.err&&h`<div className="ctl"><button onClick=${tg}>${s.p?'⏸':'▶'}</button><span>${ft(s.t)}</span><input type="range" min="0" max=${s.d||0} step="1" value=${s.t} onChange=${e=>{r.current.currentTime=+e.target.value}}/><span>${ft(s.d)}</span>
<input className="v" type="range" min="0" max="1" step=".05" value=${s.vol} title="Volume" onChange=${e=>{r.current.volume=+e.target.value;S(x=>({...x,vol:+e.target.value}))}}/>
<select value=${s.rate} onChange=${e=>{r.current.playbackRate=+e.target.value;S(x=>({...x,rate:+e.target.value}))}}>${[.5,.75,1,1.25,1.5,2].map(x=>h`<option key=${x} value=${x}>${x}x</option>`)}</select>
${v.sub&&h`<button onClick=${()=>{const t=r.current.textTracks[0];if(t)t.mode=t.mode==='showing'?'hidden':'showing'}}>CC</button>`}<button onClick=${fs}>⛶</button></div>`}</div>`}

function useShared(){
const[lv,slv]=useLS('oa_v',[]),[lp,slp]=useLS('oa_p',[]);const[rv,setRv]=useState([]),[rp,setRp]=useState([]),[ed,setEd]=useState(false),[mode,setMode]=useState('local');const db=useRef(null);
useEffect(()=>{let off=[],dead=false;(async()=>{try{if(!window.claude)return;const d=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);if(!d||dead)return;db.current=d;
try{const u=await window.claude.use('user');if(u)setEd(!!(await u.canEdit()))}catch(e){}
off.push(d.collection('videos').onSnapshot(s=>setRv(s.docs.map(x=>x.data())),()=>{}));off.push(d.collection('playlists').onSnapshot(s=>setRp(s.docs.map(x=>x.data())),()=>{}));setMode('shared')}catch(e){}})();return()=>{dead=true;off.forEach(f=>f&&f())}},[]);
const mk=(loc,sl,rem,col)=>f=>{const cur=mode==='shared'?rem:loc;const nx=typeof f==='function'?f(cur):f;if(mode!=='shared'){sl(nx);return}
const c=db.current.collection(col),old=new Map(cur.map(x=>[x.id,JSON.stringify(x)]));
nx.forEach(x=>{const j=JSON.stringify(x);if(old.get(x.id)!==j)c.doc(x.id).set(JSON.parse(j)).catch(()=>toast('Could not save. Only the owner and editors can change the shared library.'))});
cur.forEach(x=>{if(!nx.some(y=>y.id===x.id))c.doc(x.id).delete().catch(()=>{})})};
const sh=mode==='shared';
return{vids:sh?rv:lv,pls:sh?rp:lp,setV:mk(lv,slv,rv,'videos'),setP:mk(lp,slp,rp,'playlists'),ed:sh?ed:true,mode}}
function App(){
const{vids,setV,pls,setP,ed,mode}=useShared(),[fav,setF]=useLS('oa_f',[]),[his,setH]=useLS('oa_h',{}),[set,setS]=useLS('oa_s',{anim:true,sfx:true,ac:'#087BFF'});
const[hash,setHash]=useState(location.hash.slice(1)||'home'),[menu,setMenu]=useState(false),[q,setQ]=useState(''),[form,setForm]=useState(),[conf,setConf]=useState(),[tm,setTm]=useState('');
toast=m=>{setTm(m);setTimeout(()=>setTm(''),2600)};
useEffect(()=>{const f=()=>setHash(location.hash.slice(1)||'home');addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
useEffect(()=>{document.documentElement.style.setProperty('--a',set.ac)},[set.ac]);
const beep=()=>{if(!set.sfx)return;try{const x=new(window.AudioContext||webkitAudioContext)(),o=x.createOscillator(),g=x.createGain();o.connect(g);g.connect(x.destination);o.frequency.value=660;g.gain.value=.04;o.start();o.stop(x.currentTime+.06)}catch(e){}};
const go=p=>{beep();setMenu(false);location.hash=p;scrollTo(0,0)};
const play=id=>{try{document.documentElement.requestFullscreen()}catch(e){}go('watch-'+id)};
const tf=id=>setF(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]);
const save=(id,p,d,inc)=>setH(hs=>{const o=hs[id]||{n:0};return{...hs,[id]:{p,d:d||o.d||0,t:Date.now(),n:o.n+(inc?1:0)}}});
const delV=id=>{setV(vs=>vs.filter(x=>x.id!==id));setP(ps=>ps.map(p=>({...p,ids:p.ids.filter(i=>i!==id)})));setF(f=>f.filter(x=>x!==id));setH(hs=>{const n={...hs};delete n[id];return n})};
const onSave=(f,plid)=>{let id=f.id;if(id)setV(vs=>vs.map(x=>x.id===id?f:x));else{id=uid();setV(vs=>[...vs,{...f,id,added:Date.now()}])}
if(plid)setP(ps=>ps.map(p=>p.id===plid?{...p,ids:[...new Set([...p.ids,id])]}:p));setForm();toast('Saved')};
const[route,arg]=hash.split(/-(.+)/);
const c={ed,mode,vids,setV,pls,setP,fav,setF,his,setH,set,setS,q,go,play,tf,delV,id:arg,openForm:v=>setForm({v}),ask:(m,fn)=>setConf({m,fn})};
let page;
if(route==='watch'){const v=vids.find(x=>x.id===arg);const pl=pls.find(p=>p.ids.includes(arg));const queue=pl?pl.ids.map(i=>vids.find(x=>x.id===i)).filter(Boolean):vids;
page=v?h`<${Player} key=${arg} v=${v} q=${queue} go=${go} save=${save} start=${his[arg]?.p||0} exit=${()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}go('video-'+arg)}}/>`:h`<div className="pg"><${Empty} t="Video not found" s="" b=${h`<button className="btn" onClick=${()=>go('library')}>Library</button>`}/></div>`}
else{const M={home:Home,library:Lib,video:Detail,playlists:Pls,playlist:PlD,history:Hist,prefs:Prefs}[route]||Home;
const on=k=>route===k||(route==='video'&&k==='library')||(route==='playlist'&&k==='playlists')||(!{home:1,library:1,video:1,playlists:1,playlist:1,history:1,prefs:1}[route]&&k==='home');
page=h`<div><nav className="top"><button className="hb" onClick=${()=>setMenu(!menu)}>☰</button><div className="logo" onClick=${()=>go('home')}><svg className="bf" style=${{position:'static',width:34,animation:'none'}} viewBox="0 0 40 40"><path d="M20 20C14 4 2 6 4 18c1 8 10 8 16 2zM20 20c6-16 18-14 16-2-1 8-10 8-16 2zM20 20c-6 2-12 8-8 16 4 2 8-8 8-16zM20 20c6 2 12 8 8 16-4 2-8-8-8-16z"/></svg><span>Otaku <b>Archive</b></span></div>
<div className="tl">${NAV.map(([k,l,i])=>h`<button key=${k} className=${on(k)?'on':''} onClick=${()=>go(k)}>${i} ${l}</button>`)}</div>
<div className="sr"><input placeholder="Search Anime, Movies…" value=${q} onChange=${e=>{setQ(e.target.value);if(route!=='library')go('library')}}/></div><div className="av" style=${{backgroundImage:`url(${FACE})`}} onClick=${()=>go('prefs')}></div></nav>
${menu&&h`<div className="scrim" onClick=${()=>setMenu(false)}></div>`}<aside className=${'side'+(menu?' open':'')}>${NAV.map(([k,l,i])=>h`<button key=${k} className=${on(k)?'on':''} onClick=${()=>go(k)}><i>${i}</i>${l}</button>`)}</aside>
<main><${M} ...${c}/></main></div>`}
return h`<div className=${set.anim?'':'noanim'}><div className="pt"></div>${page}
${form&&h`<${Form} v=${form.v} pls=${pls} onSave=${onSave} onClose=${()=>setForm()}/>`}
${conf&&h`<div className="modal" onClick=${()=>setConf()}><div className="box" onClick=${e=>e.stopPropagation()}><p>${conf.m}</p><div style=${{display:'flex',gap:10,justifyContent:'flex-end'}}><button className="btn" onClick=${()=>setConf()}>Cancel</button><button className="btn d" onClick=${()=>{conf.fn();setConf()}}>Confirm</button></div></div></div>`}
${tm&&h`<div className="toast">${tm}</div>`}</div>`}
ReactDOM.createRoot(document.getElementById('r')).render(h`<${App}/>`);
</script></body></html>
